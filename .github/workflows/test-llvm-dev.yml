# Test against the LLVM development snapshot from apt.llvm.org.
---

name: Test LLVM development

on:
  push:
  pull_request:
  # apt.llvm.org rebuilds the snapshot every day, so test it without a push.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  test-linux-dev:
    # LLVM 24 is unreleased; apt.llvm.org publishes trunk snapshots in the
    # unversioned llvm-toolchain-jammy repository.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Install LLVM
        run: |
          echo 'deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy main' | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install --no-install-recommends llvm-24-dev
      - name: Test LLVM 24
        run:
          go test -v -tags=llvm24
